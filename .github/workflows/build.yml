name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Proteus.sln -c Release
      - name: Test
        run: dotnet test Proteus.sln -c Release --no-build
